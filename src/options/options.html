<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UTub Short Kill — Réglages</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <img class="logo" src="../../icons/icon-128.png" alt="" width="52" height="52" />
        <div>
          <h1>UTub Short Kill</h1>
          <p class="tagline">Moins de Shorts, plus de temps.</p>
        </div>
      </header>

      <section class="group">
        <label class="row switch">
          <span>
            <strong>Extension active</strong>
            <small>Désactive tout d'un coup si besoin.</small>
          </span>
          <input type="checkbox" id="enabled" />
        </label>

        <label class="row switch">
          <span>
            <strong>Masquer les Shorts</strong>
            <small>Accueil, abonnements, recherche, recommandations, barre latérale…</small>
          </span>
          <input type="checkbox" id="hideShorts" />
        </label>

        <label class="row switch">
          <span>
            <strong>Protéger l'accès par 3 questions</strong>
            <small>Ouvrir un Short demande de répondre manuellement.</small>
          </span>
          <input type="checkbox" id="gateEnabled" />
        </label>

        <label class="row switch">
          <span>
            <strong>Afficher le minuteur</strong>
            <small>Pastille discrète du temps restant pendant le visionnage.</small>
          </span>
          <input type="checkbox" id="showTimer" />
        </label>

        <label class="row switch">
          <span>
            <strong>Autoriser depuis les chaînes</strong>
            <small>Les Shorts restent visibles/accessibles sur la page d'un créateur.</small>
          </span>
          <input type="checkbox" id="allowFromChannels" />
        </label>
      </section>

      <section class="group">
        <label class="row">
          <span>
            <strong>Ouverture d'un Short débloqué</strong>
            <small>Comportement une fois l'accès accordé.</small>
          </span>
          <select id="openMode">
            <option value="short">Lecteur Shorts (format vertical)</option>
            <option value="watch">Lecteur normal (/watch, sans scroll infini)</option>
          </select>
        </label>

        <label class="row">
          <span>
            <strong>Durée de déblocage</strong>
            <small>Minutes d'accès accordées après réussite.</small>
          </span>
          <input type="number" id="unlockMinutes" min="1" max="240" />
        </label>

        <label class="row">
          <span>
            <strong>Longueur minimale des réponses</strong>
            <small>Nombre de caractères exigés par réponse.</small>
          </span>
          <input type="number" id="minAnswerLength" min="1" max="200" />
        </label>
      </section>

      <section class="group">
        <h2>Les 3 questions</h2>
        <input type="text" class="question" id="q0" />
        <input type="text" class="question" id="q1" />
        <input type="text" class="question" id="q2" />
      </section>

      <div class="footer">
        <button id="reset" class="btn ghost">Réinitialiser</button>
        <span id="status" class="status"></span>
      </div>
    </main>

    <script src="../common/defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
