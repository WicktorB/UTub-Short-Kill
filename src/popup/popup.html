<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UTub Short Kill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop">
      <header class="head">
        <img class="logo" src="../../icons/icon-128.png" alt="" width="30" height="30" />
        <h1>UTub Short Kill</h1>
      </header>

      <div id="card" class="card locked">
        <div class="dot"></div>
        <div class="txt">
          <span id="stateLabel" class="label">Shorts verrouillés</span>
          <span id="stateTime" class="time"></span>
        </div>
      </div>

      <label class="toggle">
        <input type="checkbox" id="enabled" />
        <span>Extension active</span>
      </label>

      <button id="relock" class="btn danger">Verrouiller maintenant</button>
      <button id="openOptions" class="btn ghost">Réglages…</button>
    </div>

    <script src="../common/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
